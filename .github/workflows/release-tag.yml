name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

concurrency:
  group: synth-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build and Publish
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run Tests
        run: zig build test

      - name: Work out what is being released
        id: vars
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # A release whose --version disagrees with its tag is a bug.
          declared=$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ "$declared" != "$version" ]; then
            echo "::error::tag $tag wants version $version, build.zig.zon says $declared"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build every target
        run: zig build release

      - name: Package the distributed targets
        run: ./.github/scripts/package.sh "${{ steps.vars.outputs.version }}"

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --latest \
            --title "synth v${{ steps.vars.outputs.version }}" \
            --generate-notes
